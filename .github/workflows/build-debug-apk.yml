name: Build Debug APKs (fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build extensions
        run: ./gradlew :src:en:anikoto:assembleDebug :src:en:aniwave:assembleDebug :src:en:kotokai:assembleDebug :src:en:animesogo:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: "**/build/outputs/apk/**/*.apk"
